<svg viewBox="0 0 680 514" width="680" role="img" xmlns="http://www.w3.org/2000/svg">
<title>MiniUnicorn four-layer architecture</title>
<desc>Messages flow from the channel layer through the message bus into the agent core, which calls tools, skills and model providers in the capability layer</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<g>
  <rect x="90" y="40" width="500" height="56" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Channel layer channels/</text>
  <text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">Feishu · DingTalk · WeCom · WeChat · QQ · WebSocket</text>
</g>
<line x1="340" y1="96" x2="340" y2="132" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="352" y="114" font-size="12" fill="#5F5E5A" dominant-baseline="central">InboundMessage</text>
<g>
  <rect x="90" y="136" width="500" height="56" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="154" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Message bus bus/queue.py</text>
  <text x="340" y="174" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">A 49-line async queue that fully decouples channels from the agent</text>
</g>
<line x1="340" y1="192" x2="340" y2="228" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<g>
  <rect x="60" y="232" width="560" height="166" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="252" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C">Agent core agent/</text>
  <rect x="110" y="268" width="200" height="44" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="210" y="290" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#26215C">AgentLoop · turn control</text>
  <line x1="310" y1="290" x2="366" y2="290" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <rect x="370" y="268" width="200" height="44" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="470" y="290" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#26215C">AgentRunner · LLM loop</text>
  <rect x="80" y="332" width="121" height="44" rx="8" fill="#FFFFFF" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="140" y="354" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">ToolRegistry</text>
  <rect x="213" y="332" width="121" height="44" rx="8" fill="#FFFFFF" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="273" y="354" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">SessionManager</text>
  <rect x="346" y="332" width="121" height="44" rx="8" fill="#FFFFFF" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="406" y="348" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">Dream memory</text>
  <text x="406" y="362" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">consolidation</text>
  <rect x="479" y="332" width="121" height="44" rx="8" fill="#FFFFFF" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="539" y="348" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">Context</text>
  <text x="539" y="362" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">governance</text>
</g>
<line x1="340" y1="398" x2="340" y2="434" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="352" y="416" font-size="12" fill="#5F5E5A" dominant-baseline="central">Tool calls / OutboundMessage back</text>
<g>
  <rect x="90" y="438" width="500" height="56" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="456" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Capability layer tools/ · skills/ · providers/</text>
  <text x="340" y="476" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">25 tools · 12 skills · MCP · multi-provider LLM · subagents</text>
</g>
</g>
</svg>
