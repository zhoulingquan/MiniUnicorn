[project]
name = "miniunicorn-ai"
version = "0.2.0"
description = "A personal AI agent framework with a lightweight, auditable core"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Xubin Ren"},
    {name = "the MiniUnicorn contributors"}
]
keywords = ["ai", "agent", "chatbot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
]

dependencies = [
    "typer>=0.20.0,<1.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "websockets>=16.0,<17.0",
    "websocket-client>=1.9.0,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
    "ddgs>=9.5.5,<10.0.0",
    "loguru>=0.7.3,<1.0.0",
    "readability-lxml>=0.8.4,<1.0.0",
    "rich>=14.0.0,<15.0.0",
    "croniter>=6.0.0,<7.0.0",
    "python-socketio>=5.16.0,<6.0.0",
    "msgpack>=1.1.0,<2.0.0",
    "prompt-toolkit>=3.0.50,<4.0.0",
    "questionary>=2.0.0,<3.0.0",
    "mcp>=1.26.0,<2.0.0",
    "json-repair>=0.57.0,<1.0.0",
    "chardet>=3.0.2,<6.0.0",
    "openai>=2.8.0,<3.0.0",
    "tiktoken>=0.12.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "dulwich>=0.22.0,<1.0.0",
    "pyyaml>=6.0,<7.0.0",
    "pypdf>=5.0.0,<6.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "python-pptx>=1.0.0,<2.0.0",
    "filelock>=3.25.2,<4.0.0",
    # zoneinfo 需要系统时区数据库; Windows 没有内置, 必须随包分发 tzdata,
    # 否则 cron/heartbeat 的 ZoneInfo("UTC") 回退本身就会抛 ZoneInfoNotFoundError。
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
api = [
    "aiohttp>=3.9.0,<4.0.0",
]
langsmith = [
    "langsmith>=0.1.0",
]
pdf = [
    "pymupdf>=1.25.0",
]
olostep = [
    "olostep>=0.1.0",
]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "ruff>=0.1.0",
    "pymupdf>=1.25.0",
    "packaging>=26.0",
    # 飞书频道运行时懒加载 lark_oapi(可选依赖), 但 channels 测试直接调用
    # 真实 SDK 代码路径, dev 环境必须安装。
    "lark-oapi>=1.7.0",
]

[project.scripts]
miniunicorn = "miniunicorn.cli.commands:app"

# Third-party tool plugins register here.  Built-in tools are discovered
# automatically via pkgutil scanning in ToolLoader.discover().
# [project.entry-points."miniunicorn.tools"]
# my_plugin = "my_package.plugins:MyTool"

# Third-party context governance strategies register here.  Built-in
# strategies live in miniunicorn.agent.runner_strategies and are always
# loaded first; a plugin never overrides a builtin with the same name.
# [project.entry-points."miniunicorn.context_strategies"]
# my_strategy = "my_package.strategies:MyStrategy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.hooks.custom]
# Implementation lives in the conventional `hatch_build.py` at the repo root.

[tool.hatch.build]
include = [
    "miniunicorn/**/*.py",
    "miniunicorn/templates/**/*.md",
    "miniunicorn/skills/**/*.md",
    "miniunicorn/skills/**/*.sh",
    "miniunicorn/web/dist/**/*",
]
# miniunicorn/web/dist/ is produced by `cd webui && bun run build` and is
# git-ignored. List it as an artifact so hatch ships it in both wheel and
# sdist even though VCS does not track it.
artifacts = [
    "miniunicorn/web/dist/**/*",
]

[tool.hatch.build.targets.wheel]
packages = ["miniunicorn"]

[tool.hatch.build.targets.wheel.sources]
"miniunicorn" = "miniunicorn"

[tool.hatch.build.targets.wheel.force-include]

[tool.hatch.build.targets.sdist]
include = [
    "miniunicorn/",
    "miniunicorn/web/dist/",
    "hatch_build.py",
    "README.md",
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = [
  "E501",  # line length handled by formatter
  # N999 fires on the ``miniunicorn`` package name itself (camelCase). The
  # project intentionally uses this casing for the import surface; renaming
  # would be a breaking change for all downstream users.
  "N999",
]

[tool.ruff.lint.per-file-ignores]
# __init__.py files legitimately re-export names for the public API; F401
# (unused-import) and F405 (star-import-usage) are expected patterns there.
"__init__.py" = ["F401", "F403", "F405"]
# Late imports are intentional in these modules to break circular deps and
# to defer heavy imports until first use.
"miniunicorn/providers/factory.py" = ["E402"]
"miniunicorn/agent/loop.py" = ["E402"]
"miniunicorn/cli/commands.py" = ["E402"]
# Tests use CamelCase aliases for mock patch targets (e.g. ``MockClient``) and
# sectioned late imports to keep each test block self-contained. N806/E402
# would otherwise fire noisily on conventions that are idiomatic in pytest
# suites.
"tests/**" = ["N806", "E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 600
timeout_method = "thread"

[tool.coverage.run]
source = ["miniunicorn"]
omit = ["tests/*", "**/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
