name: Test Suite

on:
  push:
    branches: [main, nightly]
  pull_request:
    branches: [main, nightly]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Check agent event JSON schema
        run: uv run python scripts/export_agent_event_schema.py --check
      # Full ruff check (all rules enabled in pyproject.toml), not just pyflakes (F).
      - name: Lint with ruff (full check)
        run: uv run ruff check miniunicorn
      - name: Format check with ruff
        run: uv run ruff format --check miniunicorn

  core:
    name: Core gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run core tests
        run: uv run pytest -m core -q

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    needs: core
    strategy:
      fail-fast: false
      matrix:
        # Cover the three major desktop OSes. Linux is the cheapest, so it
        # carries the newest AND oldest supported Python (3.11 + 3.14);
        # macOS and Windows sanity-check 3.12/3.13 to catch platform bugs
        # without exploding the matrix cost.
        os: ${{ fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') }}
        python-version: ${{ fromJSON('["3.11","3.12","3.13","3.14"]') }}
        exclude:
          # Trim cost: only run 3.12/3.13 on macOS/Windows (3.11 + 3.14 covered by Linux).
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libolm-dev build-essential

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest tests/

  frontend:
    name: WebUI lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check generated event types
        run: bun run check:protocol
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build

  packaging:
    name: Wheel / sdist / isolated install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Build wheel and sdist
        run: |
          uv build --out-dir dist-remediation
      - name: Inspect artifact metadata
        run: uv run pytest tests/packaging/test_artifacts.py -q
      - name: Twine check
        run: uv run --with twine twine check dist-remediation/*
      - name: Verify base install
        run: |
          wheel=$(ls dist-remediation/miniunicorn_ai-*.whl | head -1)
          uv run python scripts/verify_package_install.py --artifact "$wheel" --extra base --work-dir .package-smoke-base
      - name: Verify documents install
        run: |
          wheel=$(ls dist-remediation/miniunicorn_ai-*.whl | head -1)
          uv run python scripts/verify_package_install.py --artifact "$wheel" --extra documents --work-dir .package-smoke-documents
      - name: Verify bundled WebUI assets
        run: |
          python -c "
          import zipfile, sys
          wheel = [f for f in __import__('os').listdir('dist-remediation') if f.endswith('.whl')][0]
          with zipfile.ZipFile(f'dist-remediation/{wheel}') as zf:
              names = zf.namelist()
              assert any('miniunicorn/web/dist/index.html' in n for n in names), 'WebUI index.html missing from wheel'
              print('WebUI assets verified in wheel')
          "
