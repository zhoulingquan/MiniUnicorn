# MiniUnicorn Docker Compose 部署配置
#
# 快速启动:
#   docker compose up -d miniunicorn-gateway
#   → 浏览器访问 http://localhost:${WEBUI_PORT:-8765}
#
# 监督模式(设计 §27,§9.2):
#   docker compose --profile supervised up -d miniunicorn-gateway-supervised
#   使用 2 CPU / 2 GiB / 512 PID 的容器配置,匹配 3 个 Worker 的监督模式默认值。
#
# 配置持久化:宿主机 ~/.miniunicorn/ 挂载到容器内 /home/miniunicorn/.miniunicorn/
# 首次启动后,在 WebUI 的"设置 → 模型配置"里填入 LLM API Key 即可对话。
#
# 自定义端口:复制 .env.example 为 .env 修改端口,或直接 export WEBUI_PORT=9000

x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
  image: miniunicorn:local
  volumes:
    - ${MINIUNICORN_CONFIG:-${HOME}/.miniunicorn}:/home/miniunicorn/.miniunicorn
  # drop all caps, only add SYS_ADMIN for bubblewrap sandbox
  cap_drop:
    - ALL
  cap_add:
    - SYS_ADMIN
  security_opt:
    - apparmor=unconfined
  # 使用 tini 作为 PID 1,正确处理 SIGTERM,避免僵尸进程。
  # 设计 §24.6/§24.7:容器 init 负责回收子进程,Supervisor 依赖 PID 1
  # 转发 SIGTERM 以触发优雅停机(stop accepting → drain → terminate)。
  init: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# 轻量模式资源基线(设计 §27):单槽位可沿用 1 CPU / 1 GiB。
x-lightweight-resources: &lightweight-resources
  deploy:
    resources:
      limits:
        cpus: "1"
        memory: 1G
        pids: 200
      reservations:
        cpus: "0.25"
        memory: 256M
  # 设计 §24.7/§27:停机宽限需覆盖 shutdownGraceS(默认 60s)。
  # 轻量模式无子进程树,30s 足够排空在途请求。
  stop_grace_period: 30s

# 监督模式资源基线(设计 §27):3 个 Worker 至少 2 CPU / 2 GiB / PID 512。
x-supervised-resources: &supervised-resources
  deploy:
    resources:
      limits:
        cpus: "2"
        memory: 2G
        pids: 512
      reservations:
        cpus: "0.5"
        memory: 512M
  # 设计 §24.7:监督模式停机需排空 Control Plane + N 个 Worker,
  # 并终止整棵子进程树;宽限必须 ≥ runtime.shutdownGraceS(默认 60s)。
  stop_grace_period: 75s

services:
  miniunicorn-gateway:
    container_name: miniunicorn-gateway
    <<: *common-config
    <<: *lightweight-resources
    command: ["gateway"]
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-8765}:8765"
    healthcheck:
      # 设计 §4.6: 改用公开的 /health,避免 token/secret 启用后旧 / 端点
      # 行为变化或被鉴权拦截导致容器被误判 unhealthy。
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 监督模式变体(设计 §9.2,§27,WP8 task 5):
  # 使用 2 CPU / 2 GiB / 512 PID 的容器配置,匹配 3 个 Worker 的监督模式默认值。
  # 通过 --profile supervised 启用,与轻量模式互斥(同一端口需手动避免冲突)。
  # 运行时模式由配置文件中的 runtime.mode=supervised 选择(设计 §9.3),
  # 此处仅提供匹配监督模式的容器资源基线。
  miniunicorn-gateway-supervised:
    container_name: miniunicorn-gateway-supervised
    <<: *common-config
    <<: *supervised-resources
    command: ["gateway"]
    restart: unless-stopped
    profiles:
      - supervised
    ports:
      - "${WEBUI_PORT:-8765}:8765"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 监督模式需要启动 Control Plane + N 个 Worker,启动期更长。
      start_period: 45s

  miniunicorn-api:
    container_name: miniunicorn-api
    <<: *common-config
    <<: *lightweight-resources
    command:
      ["serve", "--host", "0.0.0.0", "-w", "/home/miniunicorn/.miniunicorn/api-workspace"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8900}:8900"
    healthcheck:
      # 设计 §4.6: 改用公开的 /health。旧版用 /v1/models,API 启用 key 后
      # 该端点返回 401,healthcheck 永远失败,容器被误判 unhealthy。
      # /health 在 api/server.py 中显式标记为 public,任何鉴权状态下都返回 200。
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8900/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  miniunicorn-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
