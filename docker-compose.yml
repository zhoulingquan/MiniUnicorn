# MiniUnicorn Docker Compose 部署配置
#
# 快速启动:
#   docker compose up -d miniUnicorn-gateway
#   → 浏览器访问 http://localhost:${WEBUI_PORT:-8765}
#
# 配置持久化:宿主机 ~/.miniUnicorn/ 挂载到容器内 /home/miniUnicorn/.miniUnicorn/
# 首次启动后,在 WebUI 的"设置 → 模型配置"里填入 LLM API Key 即可对话。
#
# 自定义端口:复制 .env.example 为 .env 修改端口,或直接 export WEBUI_PORT=9000

x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
  image: miniunicorn:local
  volumes:
    - ${MINIUNICORN_CONFIG:-~/.miniUnicorn}:/home/miniUnicorn/.miniUnicorn
  # drop all caps, only add SYS_ADMIN for bubblewrap sandbox
  cap_drop:
    - ALL
  cap_add:
    - SYS_ADMIN
  security_opt:
    - apparmor=unconfined
  # 使用 tini 作为 PID 1,正确处理 SIGTERM,避免僵尸进程
  init: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  deploy:
    resources:
      limits:
        cpus: "1"
        memory: 1G
        pids: 200
      reservations:
        cpus: "0.25"
        memory: 256M

services:
  miniUnicorn-gateway:
    container_name: miniUnicorn-gateway
    <<: *common-config
    command: ["gateway"]
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-8765}:8765"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  miniUnicorn-api:
    container_name: miniUnicorn-api
    <<: *common-config
    command:
      ["serve", "--host", "0.0.0.0", "-w", "/home/miniUnicorn/.miniUnicorn/api-workspace"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8900}:8900"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8900/v1/models"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  miniUnicorn-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
